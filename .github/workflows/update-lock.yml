# One-off helper (run): updates package-lock.json after package.json changes
# (npm is not usable from the development environment). Removed again afterwards.
name: Update package-lock (one-off)

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/update-lock.yml']

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json" || echo "nothing to commit"
          git push origin HEAD:dev
