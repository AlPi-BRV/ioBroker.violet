<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool-Display</title>
<!--
  Pool-Display für ioBroker.violet – im Stil der alten ProCon.IP-Anzeige
  Datenquelle: eingebauter Webserver des Violet-Adapters (Standard-Port 8099)
  Baut sich selbst auf: angezeigt wird nur, was der Adapter liefert (info.features).
  URL-Parameter: ?api=http://10.10.3.x:8099   ?demo=1   ?lang=en   ?font=arial
-->
<style>
  :root {
    --bg: #54585e;          /* mittleres Grau */
    --bg-deep: #3f4247;
    --row-a: #000;
    --row-b: rgba(0,0,0,.28);
    --line: rgba(255,255,255,.55);
    --text: #fff;
    --muted: #c9ccd1;
    --min: #6ea8ff;
    --max: #ff6b6b;
    --bad: #ff3b3b;
    --on: #3ddc5c;
    --off: #e0383e;
    --wait: #f0b429;
    --auto: #2e9e44;
    --manual-on: #2f6fd6;
    --manual-off: #b8262c;
    --seg: #2a2d31;
    --font: Verdana, "DejaVu Sans", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: var(--bg-deep); }
  body {
    background: radial-gradient(ellipse at top, #62666c 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: var(--font);
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 1374px; margin: 0; transform-origin: 0 0; padding: 19px 22px; }

  /* ---------- obere Tabelle ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr 1.25fr; }
  .head {
    position: relative; text-align: center; font-size: 19px; letter-spacing: .04em;
    padding: .5em 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .head .hbtn {
    position: absolute; right: .6em; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: .62em; letter-spacing: .03em; color: #fff; cursor: pointer;
    background: linear-gradient(#4a4f55, #2c3035); border: 1px solid rgba(255,255,255,.4);
    border-radius: 5px; padding: .45em .8em;
  }
  .head .hbtn:hover { background: linear-gradient(#5a6067, #353a40); }
  .head .hbtn.active { background: linear-gradient(#4c8af0, var(--manual-on)); }
  .cell {
    display: flex; align-items: center; gap: .8em;
    min-height: 88px; padding: .4em .9em;
    font-size: 16.5px;
  }
  .ev { background: var(--row-a); } .od { background: var(--row-b); }

  .lbl { flex: 1 1 52%; text-align: right; line-height: 1.25; }
  .lbl .main { font-size: 1.12em; }
  .lbl .sub { display: block; margin-top: .3em; font-size: .74em; font-weight: 400; color: var(--muted); }
  .val { flex: 1 1 48%; line-height: 1.15; }
  .val .big { font-size: 1.62em; white-space: nowrap; }
  .val .unit { font-size: .6em; color: var(--muted); margin-left: .15em; }
  .mm { display: block; margin-top: .35em; font-size: .72em; font-weight: 400; white-space: nowrap; }
  .mm .lo { color: var(--min); margin-right: .9em; } .mm .hi { color: var(--max); }
  .mm .lo::before { content: "↓"; } .mm .hi::before { content: "↑"; }
  .note { display: block; margin-top: .25em; font-size: .7em; font-weight: 400; color: var(--muted); }

  .badge {
    font-size: .64em; padding: .45em .6em; border-radius: 5px; min-width: 4.6em; text-align: center;
    border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .badge.auto { background: linear-gradient(#3cb556, var(--auto)); }
  .badge.man-on { background: linear-gradient(#4c8af0, var(--manual-on)); }
  .badge.man-off { background: linear-gradient(#d8414a, var(--manual-off)); }

  /* Temperaturen + Wasserwerte: feste Beschriftungsbreite -> Doppelpunkte untereinander */
  .tw { gap: 1.4em; }
  .tw .lbl { flex: 0 0 auto; }
  .lbl .sub { white-space: nowrap; }
  .bad { color: var(--bad) !important; }
  .star { font-size: .5em; vertical-align: super; margin-left: .05em; opacity: .85; }
  .vsub { display: block; margin-top: .3em; font-size: .74em; font-weight: 400; color: var(--muted); white-space: nowrap; }  /* Breite setzt alignLabels() je Spalte */
  .tw .val { flex: 1 1 auto; min-width: 0; }
  .tw .badge { flex: 0 0 auto; margin-left: auto; }

  /* Relais-Spalte */
  .relay .lbl { flex: 0 0 33%; }
  .state { flex: 0 0 auto; display: flex; align-items: center; gap: .5em; min-width: 5em; }
  .ctrl { display: flex; flex-direction: column; align-items: flex-start; gap: .4em; }
  .ctrl .line { display: flex; align-items: center; gap: .5em; }
  .lamp {
    width: 1em; height: 1em; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #ff9a9a, var(--off) 55%, #6b0f12);
    box-shadow: 0 0 .5em rgba(224,56,62,.6);
  }
  .lamp.on { background: radial-gradient(circle at 35% 30%, #b8ffc5, var(--on) 55%, #0c5a1c); box-shadow: 0 0 .6em rgba(61,220,92,.75); }
  .lamp.wait { background: radial-gradient(circle at 35% 30%, #ffe6a3, var(--wait) 55%, #6b4a05); box-shadow: 0 0 .6em rgba(240,180,41,.7); }

  .seg { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); flex: 0 0 auto; }
  .seg button {
    font: inherit; font-size: .7em; color: #ddd; background: var(--seg); border: 0; cursor: pointer;
    padding: .55em .75em; border-right: 1px solid rgba(255,255,255,.15); min-width: 3.6em;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover:not(:disabled) { background: #3a3e43; color: #fff; }
  .seg button.sel.auto { background: var(--auto); color: #fff; }
  .seg button.sel.on { background: var(--manual-on); color: #fff; }
  .seg button.sel.off { background: var(--manual-off); color: #fff; }
  .seg button.sel.lvl { background: #6c737b; color: #fff; }
  .seg button.sel.lvl.run { background: var(--auto); color: #fff; }
  .seg button.pending { animation: pulse .8s ease-in-out infinite; }
  .seg.small button { font-size: .62em; padding: .45em .6em; min-width: 3.2em; }
  .pv {
    font-size: .7em; padding: .55em .75em; border-radius: 6px; color: #fff;
    background: var(--auto); border: 1px solid rgba(255,255,255,.3);
  }
  select.dmx {
    font: inherit; font-size: .7em; color: #fff; background: var(--seg);
    border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: .4em .5em;
  }
  @keyframes pulse { 50% { opacity: .45; } }

  /* Relais-Ansicht (ersetzt die Temperaturspalte) */
  .rlist { display: flex; flex-direction: column; gap: .35em; width: 100%; }
  .rrow { display: flex; align-items: center; gap: .6em; }
  .rrow .rname { flex: 1 1 auto; text-align: right; font-size: .92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .rname.dim { color: var(--muted); font-weight: 400; }

  /* Datum / Uhrzeit */
  .clock {
    display: flex; justify-content: center; gap: 3.5em; align-items: baseline;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 14px;
    padding: .35em 0; font-size: 32px; letter-spacing: .05em;
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
  }

  /* Große Anzeige */
  .hero { display: grid; grid-template-columns: 1fr 1fr; background: #000; margin-top: 14px; }
  .hero > div { text-align: center; padding: .15em 0 .6em; }
  .hero .num { font-size: 158px; line-height: 1; letter-spacing: -.01em; }
  .hero .cap { margin-top: 1.1em; font-size: 18px; }

  .bottom {
    display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; text-align: center;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 14px; padding: .25em 0;
  }
  .bottom .xl { font-size: 42px; }
  .bottom .md { font-size: 17px; }

  .foot {
    display: flex; justify-content: center; gap: 3em; flex-wrap: wrap; padding: .75em 0 .2em;
    font-size: 13px; font-weight: 400; color: var(--muted);
  }
  .conn::before { content: "●"; margin-right: .4em; color: var(--on); }
  .conn.err::before { color: var(--off); }
  .conn.demo::before { color: var(--wait); }
  .conn.msg { color: #ffd666; cursor: pointer; font-weight: 700; }
  .conn.msg::before { color: var(--wait); animation: blink 1s steps(2, start) infinite; text-shadow: 0 0 6px rgba(240,180,41,.9); }
  .conn.msg:hover { text-decoration: underline; }
  @keyframes blink { to { visibility: hidden; } }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(150%);
    background: #111; border: 1px solid rgba(255,255,255,.3); padding: .7em 1.1em; border-radius: 8px;
    font-size: 13px; font-weight: 400; transition: transform .25s ease, opacity .25s; z-index: 9; max-width: 90vw; opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div class="grid" id="grid"></div>

  <div class="clock"><span id="date">–</span><span id="time">–</span></div>

  <div class="hero" id="hero">
    <div id="heroWaterBox"><div class="num" id="heroWater">–</div><div class="cap" id="heroWaterCap">–</div></div>
    <div id="heroAirBox"><div class="num" id="heroAir">–</div><div class="cap" id="heroAirCap">–</div></div>
  </div>

  <div class="bottom">
    <div class="xl" id="botPh">pH: –</div>
    <div class="md" id="botFlow">–</div>
    <div class="xl" id="botRdx">RedOx: –</div>
  </div>

  <div class="foot">
    <span id="fw">Violet Firmware: –</span>
    <span id="up">Uptime: –</span>
    <span id="cpu">CPU: –</span>
    <span id="conn" class="conn">–</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   KONFIGURATION – optional, alles andere erkennt das Pool-Display selbst
   ===================================================================== */
const CONFIG = {
  // Adresse des Violet-Adapters; Standard: die Seite wird vom Adapter selbst ausgeliefert
  api: location.protocol.startsWith('http') ? location.origin : 'http://localhost:8099',
  pollMs: 5000,

  // Temperatur-Zeilen: Hauptsensor + kleine Zusatzzeile (Sensor-Nummern der Violet).
  // Namen kommen aus der Adapter-Konfiguration; nicht angeschlossene Sensoren entfallen.
  // Leere Liste [] = automatisch alle angeschlossenen Sensoren, je zwei pro Zeile.
  temps: [
    { sensor: 2, sub: 11 },
    { sensor: 3, sub: 4 },
    { sensor: 1, sub: 8 },
    { sensor: 7, sub: 9 },
  ],
  heroWater: 1,   // große Anzeige links  (Sensor-Nummer)
  heroAir: 2,     // große Anzeige rechts (Sensor-Nummer)
  relayViewTimeout: 120, // Sekunden ohne Bedienung, dann zurück zu den Temperaturen
};

/* =====================================================================
   ab hier nichts ändern nötig
   ===================================================================== */
const params = new URLSearchParams(location.search);
if (params.get('api')) CONFIG.api = params.get('api').replace(/\/+$/, '');
let demo = params.get('demo') === '1';

const FONTS = {
  verdana: 'Verdana, "DejaVu Sans", Tahoma, sans-serif',
  arial: 'Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif',
  system: 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif',
};

/* ---------- Texte (Deutsch / Englisch) ---------- */
const TXT = {
  de: {
    temps: 'TEMPERATUREN', water: 'WASSERWERTE', relays: 'RELAISSTATUS', relayView: 'RELAIS',
    btnRelays: 'Relais', btnTemps: 'Temperaturen',
    off: 'AUS', on: 'EIN', wait: 'WARTET', blocked: 'GESPERRT', emergOff: 'NOT-AUS', auto: 'AUTO',
    pump: 'Filterpumpe', solar: 'Absorber', heater: 'Heizung', light: 'Licht', eco: 'ECO-Modus',
    backwash: 'Rückspülung', refill: 'Nachspeisung', dmx: 'DMX',
    today: 'heute', mlToday: 'ml heute', scene: 'Szene', sceneOff: 'Szene aus', sceneChoose: 'Szene wählen …',
    chlorine: 'Chlor', floc: 'Flockung', fw: 'Violet Firmware', uptime: 'Uptime',
    live: 'Live', demo: 'Demo-Daten', stale: 'Violet zurzeit nicht erreichbar – letzte Werte',
    msg: 'Meldung der Violet', msgs: 'Meldungen der Violet', msgHint: 'Klicken öffnet die Violet in einem neuen Fenster',
    confirmPumpOff: 'Filterpumpe wirklich manuell AUSschalten?',
    sent: 'Befehl gesendet', speedSet: 'Drehzahl gesetzt', failed: 'Schalten fehlgeschlagen', demoSim: 'Demo: Befehl simuliert',
    dosingOnly: 'Dosierung – nur Anzeige', level: 'Stufe', running: 'läuft', stop: 'STOP', clockSuffix: ' Uhr',
    noData: 'Keine Daten vom Violet-Adapter',
    noDataHint: 'Läuft die Instanz violet.0 und ist in der Konfiguration „Pool-Display bereitstellen“ aktiviert? Test im Browser:',
    demoHint: 'Vorschau mit Beispielwerten: <b>?demo=1</b> an die Adresse anhängen',
    timeout: 'keine Antwort (Zeitüberschreitung)', unreachable: 'nicht erreichbar', noValues: 'der Adapter hat noch keine Daten von der Violet',
  },
  en: {
    temps: 'TEMPERATURES', water: 'WATER VALUES', relays: 'RELAY STATUS', relayView: 'RELAYS',
    btnRelays: 'Relays', btnTemps: 'Temperatures',
    off: 'OFF', on: 'ON', wait: 'WAIT', blocked: 'BLOCKED', emergOff: 'EMERG. OFF', auto: 'AUTO',
    pump: 'Filter pump', solar: 'Absorber', heater: 'Heating', light: 'Light', eco: 'ECO mode',
    backwash: 'Backwash', refill: 'Refill', dmx: 'DMX',
    today: 'today', mlToday: 'ml today', scene: 'Scene', sceneOff: 'Scene off', sceneChoose: 'Choose scene …',
    chlorine: 'Chlorine', floc: 'Flocculant', fw: 'Violet firmware', uptime: 'Uptime',
    live: 'Live', demo: 'Demo data', stale: 'Violet currently not reachable – last values',
    msg: 'Violet message', msgs: 'Violet messages', msgHint: 'Click to open the Violet in a new window',
    confirmPumpOff: 'Really switch the filter pump OFF manually?',
    sent: 'Command sent', speedSet: 'Speed set', failed: 'Switching failed', demoSim: 'Demo: command simulated',
    dosingOnly: 'Dosing – display only', level: 'Level', running: 'running', stop: 'STOP', clockSuffix: '',
    noData: 'No data from the Violet adapter',
    noDataHint: 'Is the instance violet.0 running and “Provide pool display” enabled in the configuration? Test in the browser:',
    demoHint: 'Preview with sample values: append <b>?demo=1</b> to the address',
    timeout: 'no answer (timeout)', unreachable: 'not reachable', noValues: 'the adapter has no data from the Violet yet',
  },
};
let LANG = (params.get('lang') || navigator.language || 'de').slice(0, 2).toLowerCase() === 'de' ? 'de' : 'en';
const t = (k) => (TXT[LANG] && k in TXT[LANG] ? TXT[LANG][k] : k in TXT.en ? TXT.en[k] : k);
const LOCALE = () => (LANG === 'de' ? 'de-DE' : 'en-GB');

const STATUS_TXT = () => ({ 0: t('off'), 1: t('on'), 2: t('blocked'), 3: t('on'), 4: t('on'), 5: t('emergOff'), 6: t('off') });
const STAGES = { 1: 'ECO', 2: 'Normal', 3: 'Boost' };
// mögliche Funktionen in der Relais-Spalte (erscheinen nur, wenn vorhanden)
const FUNCS = [
  { key: 'pumpe', label: 'pump' },
  { key: 'solar', label: 'solar' },
  { key: 'heizung', label: 'heater' },
  { key: 'licht', label: 'light' },
  { key: 'eco', label: 'eco' },
  { key: 'rueckspuelung', label: 'backwash' },
  { key: 'nachspeisung', label: 'refill' },
];
const FLOW_UNITS = /cm\/s/i;

/* ---------- Demo-Daten (Werte deiner Anlage vom 09.10.2026) ---------- */
const DEMO_TEMPS = { 1: 'Wassertemperatur', 2: 'Außentemperatur', 3: 'Absorbertemperatur', 4: 'Absorber-Rücklauf', 7: 'Pool Rücklauf', 8: 'Heizung Vorlauf', 9: 'Heizung Rücklauf', 11: 'Schwimmbad' };
const DEMO = {
  'info.features': JSON.stringify({
    lang: LANG, font: params.get('font') || 'verdana', violetUrl: 'http://violet.local', switching: true, pumpRpm: true, pv: true, dmx: true,
    temps: Object.entries(DEMO_TEMPS).map(([n, name]) => ({ n: Number(n), name })),
    ranges: { ph: [7.0, 7.4], redox: [650, 800], chlor: [0.3, 0.6] }, t1Pool: true,
    vrelays: [{ id: 'vrelais.1', name: 'Teichpumpe' }, { id: 'vrelais.2', name: 'Gartenbrunnen' }],
    relays: [1, 2, 3, 4, 5, 6, 7, 8].map((r) => ({ id: `relais.ext1_${r}`, name: { 6: 'Gartenlicht', 8: 'Teichpumpe' }[r] || `EXT1.${r}`, named: r === 6 || r === 8 })),
    analog: [
      { id: 'analog.adc1', name: 'Filterdruck', unit: 'bar' },
      { id: 'analog.adc5', name: 'Luftfeuchte', unit: '%rF' },
      { id: 'analog.impuls1', name: 'Anströmung', unit: 'cm/s' },
    ],
    messages: { enabled: true, active: params.get('msg') === '1', count: 1, text: 'Elektroden-Kalibrierung überfällig', time: '10.10.2026 09:12:00', type: 'REMINDER' },
  }),
  'wasser.ph': 7.22, 'wasser.ph_min': 7.19, 'wasser.ph_max': 7.29,
  'wasser.redox': 885.2, 'wasser.redox_min': 824.9, 'wasser.redox_max': 898.7,
  'wasser.chlor': 0.19, 'wasser.chlor_min': 0.14, 'wasser.chlor_max': 0.36,
  'dosierung.ph_minus.tagesmenge': 8, 'dosierung.ph_minus.status': 0, 'dosierung.chlor.tagesmenge': 9, 'dosierung.chlor.status': 0,
  'temperatur.sensor1': 21.1, 'temperatur.sensor1_min': 20.1, 'temperatur.sensor1_max': 21.3,
  'temperatur.sensor2': 12.0, 'temperatur.sensor2_min': 10.0, 'temperatur.sensor2_max': 12.0,
  'temperatur.sensor3': 12.3, 'temperatur.sensor3_min': 8.4, 'temperatur.sensor3_max': 16.2,
  'temperatur.sensor4': 22.4, 'temperatur.sensor7': 21.1, 'temperatur.sensor7_min': 19.3, 'temperatur.sensor7_max': 21.2,
  'temperatur.sensor8': 31.9, 'temperatur.sensor9': 29.5, 'temperatur.sensor11': 21.7,
  'analog.adc5': 63.0, 'analog.adc1': 0.0, 'analog.impuls1': 0.0,
  'pumpe.status': 1, 'pumpe.aktiv': true, 'pumpe.schalten': 'AUTO', 'pumpe.laufzeit_heute': '06h 49m 17s', 'dosierung.flockung.tagesmenge': 36, 'temperatur.sensor1_pool': 20.9, 'temperatur.sensor1_eingefroren': true, 'vrelais.1': true, 'vrelais.2': false, 'pumpe.umwaelzung_heute': 31.6, 'pumpe.stufe': 2, 'pumpe.drehzahl_soll': 2,
  'pv.ueberschuss': 1,
  'solar.status': 6, 'solar.aktiv': false, 'solar.schalten': 'OFF', 'solar.laufzeit_heute': '00h 00m 00s',
  'heizung.status': 6, 'heizung.aktiv': false, 'heizung.schalten': 'OFF', 'heizung.laufzeit_heute': '00h 00m 00s',
  'licht.status': 0, 'licht.aktiv': false, 'licht.schalten': 'AUTO',
  'system.firmware': '1.2.5', 'system.laufzeit': '09d 16h 25m', 'system.cpu_temperatur': 53.2,
};
for (let s = 1; s <= 12; s++) { DEMO[`dmx.szene${s}.status`] = s === 3 ? 4 : 0; DEMO[`dmx.szene${s}.aktiv`] = s === 3; DEMO[`dmx.szene${s}.schalten`] = s === 3 ? 'ON' : 'AUTO'; }
for (let r = 1; r <= 8; r++) { DEMO[`relais.ext1_${r}.status`] = r === 6 ? 4 : 6; DEMO[`relais.ext1_${r}.aktiv`] = r === 6; DEMO[`relais.ext1_${r}.schalten`] = r === 6 ? 'ON' : 'OFF'; }
// Demo-Varianten zum Ausprobieren: ?demo=1&ohne=heizung,solar,pv,dmx,relais   &msg=1
if (params.get('ohne')) {
  const f = JSON.parse(DEMO['info.features']);
  for (const k of params.get('ohne').split(',')) {
    for (const id of Object.keys(DEMO)) if (id.startsWith(k + '.')) delete DEMO[id];
    if (k === 'pv') f.pv = false;
    if (k === 'dmx') f.dmx = false;
    if (k === 'relais') f.relays = [];
  }
  DEMO['info.features'] = JSON.stringify(f);
}

let V = {};
let F = { temps: [], relays: [], analog: [], messages: { enabled: false }, ranges: {}, rows: [], hero: [], vrelays: [] };
let layoutSig = '';
let relayView = false;
let relayViewTimer = null;
const pending = {};
const $ = (id) => document.getElementById(id);
const has = (id) => V[id] !== undefined && V[id] !== null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kid = (k) => k.replace(/\./g, '_');

function fmt(v, d = 1) {
  if (v === undefined || v === null || v === '' || !Number.isFinite(Number(v))) return '–';
  return Number(v).toLocaleString(LOCALE(), { minimumFractionDigits: d, maximumFractionDigits: d });
}

/* ---------- was ist vorhanden? ---------- */
const tempName = (n) => (F.temps.find((x) => x.n === n) || {}).name || `${LANG === 'de' ? 'Temperatur' : 'Temperature'} ${n}`;
const tempOk = (n) => n && has(`temperatur.sensor${n}`) && (!F.temps.length || F.temps.some((x) => x.n === n));

function tempRows() {
  const conf = F.rows && F.rows.length ? F.rows : CONFIG.temps;
  if (conf && conf.length) {
    return conf
      .filter((x) => tempOk(x.sensor) || tempOk(x.sub))
      .map((x) => (tempOk(x.sensor) ? x : { sensor: x.sub }))
      .map((x) => ({ sensor: x.sensor, sub: x.sub !== x.sensor && tempOk(x.sub) ? x.sub : null }));
  }
  const list = (F.temps.length ? F.temps.map((x) => x.n) : [...Array(12).keys()].map((i) => i + 1)).filter(tempOk);
  const rows = [];
  for (let i = 0; i < list.length; i += 2) rows.push({ sensor: list[i], sub: list[i + 1] || null });
  return rows;
}

function waterRows() {
  const rows = [];
  if (has('wasser.ph')) rows.push('ph');
  if (has('wasser.redox')) rows.push('redox');
  if (has('wasser.chlor')) rows.push('chlor');
  else if (has('dosierung.flockung.tagesmenge')) rows.push('floc');
  const an = F.analog.filter((a) => !FLOW_UNITS.test(a.unit) && has(a.id));
  for (let i = 0; i < an.length; i += 2) rows.push({ main: an[i], note: an[i + 1] });
  return rows;
}

const dmxOn = () => F.dmx && has('dmx.szene1.status');

function relayRows() {
  const rows = [];
  for (const f of FUNCS) {
    if (f.key === 'licht') {
      if (has('licht.status') || dmxOn()) rows.push({ key: 'licht', label: f.label, light: has('licht.status'), dmx: dmxOn() });
      continue;
    }
    if (has(`${f.key}.status`)) rows.push({ key: f.key, label: f.label });
  }
  return rows;
}

const relayList = () => [...F.relays.filter((r) => has(`${r.id}.status`)), ...F.vrelays.filter((v) => has(v.id)).map((v) => ({ ...v, named: true, virtual: true }))];

/* ---------- Aufbau ---------- */
function build() {
  const T = tempRows(), W = waterRows(), R = relayRows(), RL = relayList();
  if (!RL.length) relayView = false;
  const firstCol = relayView ? Math.ceil(RL.length / 2) : T.length;
  const n = Math.max(firstCol, W.length, R.length, 1);
  const showFirst = relayView || T.length;
  const cols = [showFirst && (relayView ? t('relayView') : t('temps')), W.length && t('water'), R.length && t('relays')];
  const g = $('grid');
  g.style.gridTemplateColumns = cols.map((c, i) => (c ? (i === 2 ? '1.25fr' : '1fr') : null)).filter(Boolean).join(' ') || '1fr';
  g.innerHTML = cols.map((h, i) => {
    if (!h) return '';
    const btn = i === 2 && RL.length ? `<button class="hbtn ${relayView ? 'active' : ''}" id="relayBtn">${relayView ? t('btnTemps') : t('btnRelays')}</button>` : '';
    return `<div class="head">${h}${btn}</div>`;
  }).join('');
  for (let r = 0; r < n; r++) {
    const cls = `cell ${r % 2 ? 'od' : 'ev'}`;
    if (showFirst) {
      if (relayView) g.insertAdjacentHTML('beforeend', relayPairCell(RL.slice(r * 2, r * 2 + 2), cls));
      else g.insertAdjacentHTML('beforeend', T[r] ? tempCell(T[r], r, cls) : `<div class="${cls}"></div>`);
    }
    if (W.length) g.insertAdjacentHTML('beforeend', W[r] ? waterCell(W[r], cls) : `<div class="${cls}"></div>`);
    if (R.length) g.insertAdjacentHTML('beforeend', R[r] ? relayCell(R[r], cls) : `<div class="${cls} relay"></div>`);
  }
  g.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', onSegClick));
  g.querySelectorAll('select.dmx').forEach((s) => s.addEventListener('change', onDmxChange));
  const rb = $('relayBtn');
  if (rb) rb.addEventListener('click', toggleRelayView);
  g.dataset.rows = JSON.stringify({ T, R });

  // große Anzeige und Fußzeile
  const hL = F.hero[0] || CONFIG.heroWater, hR = F.hero[1] || CONFIG.heroAir;
  const hw = tempOk(hL) ? hL : (T[0] || {}).sensor;
  const ha = tempOk(hR) ? hR : (T[1] || {}).sensor;
  $('hero').style.display = hw || ha ? '' : 'none';
  $('heroWaterBox').style.display = hw ? '' : 'none';
  $('heroAirBox').style.display = ha ? '' : 'none';
  $('heroWaterCap').textContent = hw ? tempName(hw) : '';
  $('heroAirCap').textContent = ha ? tempName(ha) : '';
  $('hero').style.gridTemplateColumns = hw && ha ? '1fr 1fr' : '1fr';
  $('hero').dataset.w = hw || ''; $('hero').dataset.a = ha || '';
  const flow = F.analog.find((a) => FLOW_UNITS.test(a.unit) && has(a.id));
  $('botFlow').style.visibility = flow ? '' : 'hidden';
  $('botFlow').dataset.id = flow ? flow.id : '';
  $('botFlow').dataset.name = flow ? flow.name : '';
  $('botPh').style.visibility = has('wasser.ph') ? '' : 'hidden';
  $('botRdx').style.visibility = has('wasser.redox') ? '' : 'hidden';
  alignLabels();
  setTimeout(fit, 0);
}

function tempCell(x, r, cls) {
  return `<div class="${cls} tw twT">
    <div class="lbl"><span class="main">${esc(tempName(x.sensor))}:</span><span class="sub" id="tsub${r}"></span></div>
    <div class="val"><span class="big" id="t${r}">–</span><span class="mm" id="tmm${r}"></span></div></div>`;
}

function waterCell(w, cls) {
  cls += ' tw twW';
  if (w === 'ph') return `<div class="${cls}"><div class="lbl"><span class="main">pH:</span></div>
    <div class="val"><span class="big" id="ph">–</span><span class="mm" id="phmm"></span><span class="note" id="phdos"></span></div>
    <span class="badge" id="phmode">–</span></div>`;
  if (w === 'redox') return `<div class="${cls}"><div class="lbl"><span class="main">RedOx:</span></div>
    <div class="val"><span class="big" id="rdx">–</span><span class="unit">mV</span><span class="mm" id="rdxmm"></span><span class="note" id="cldos"></span></div>
    <span class="badge" id="clmode">–</span></div>`;
  const floc = has('dosierung.flockung.tagesmenge');
  if (w === 'chlor') return `<div class="${cls}"><div class="lbl"><span class="main">${t('chlorine')}:</span>${floc ? `<span class="sub">${t('floc')}:</span>` : ''}</div>
    <div class="val"><span class="big" id="cl">–</span><span class="unit">mg/l</span>${floc ? '<span class="vsub" id="floc"></span>' : '<span class="mm" id="clmm"></span>'}</div></div>`;
  if (w === 'floc') return `<div class="${cls}"><div class="lbl"><span class="main">${t('floc')}:</span></div>
    <div class="val"><span class="big" id="flocBig">–</span><span class="unit">ml</span><span class="vsub">${t('today')}</span></div></div>`;
  return `<div class="${cls}"><div class="lbl"><span class="main">${esc(w.main.name)}:</span>${w.note ? `<span class="sub">${esc(w.note.name)}:</span>` : ''}</div>
    <div class="val"><span class="big" data-an="${w.main.id}" data-d="${w.main.unit === 'bar' ? 2 : 1}">–</span><span class="unit">${esc(w.main.unit)}</span>${w.note ? `<span class="vsub" data-note="${w.note.id}" data-unit="${esc(w.note.unit)}"></span>` : ''}</div></div>`;
}

const onOffSeg = (k) => `<div class="seg small" data-key="${k}" data-virtual="1">
  <button data-v="ON" class="on">${t('on')}</button><button data-v="OFF" class="off">${t('off')}</button></div>`;

/* Wert eines Temperaturfühlers; Sensor 1 bei Fühler in der Verrohrung: eingefrorener Poolwert mit * */
function tempText(n, d, unit = '°') {
  if (Number(n) === 1 && F.t1Pool && has('temperatur.sensor1_pool')) {
    return `${fmt(V['temperatur.sensor1_pool'], d)}${unit}${V['temperatur.sensor1_eingefroren'] ? '<span class="star">*</span>' : ''}`;
  }
  return `${fmt(V[`temperatur.sensor${n}`], d)}${unit}`;
}

/* Optimalbereich aus der Konfiguration: außerhalb → rot */
function rangeMark(elId, valId, key) {
  const e = $(elId), r = F.ranges[key];
  if (!e) return;
  const v = Number(V[valId]);
  const lo = r && r[0] !== null && r[0] !== undefined ? r[0] : null;
  const hi = r && r[1] !== null && r[1] !== undefined ? r[1] : null;
  e.classList.toggle('bad', Number.isFinite(v) && has(valId) && ((lo !== null && v < lo) || (hi !== null && v > hi)));
}

const modeSeg = (k, small = '') => `<div class="seg ${small}" data-key="${k}">
  <button data-v="AUTO" class="auto">${t('auto')}</button><button data-v="ON" class="on">${t('on')}</button><button data-v="OFF" class="off">${t('off')}</button></div>`;

function relayCell(x, cls) {
  const k = x.key, id = kid(k);
  const state = `<div class="state"><span class="lamp" id="${id}lamp"></span><span id="${id}txt">–</span></div>`;
  if (k === 'pumpe') {
    const stage = F.pumpRpm || has('pumpe.stufe') ? `<div class="line"><div class="seg" data-speed="1">
      <button data-v="1" class="lvl">ECO</button><button data-v="2" class="lvl">Normal</button><button data-v="3" class="lvl">Boost</button></div></div>` : '';
    return `<div class="${cls} relay">
      <div class="lbl"><span class="main">${t('pump')}:</span><span class="sub" id="${id}rt"></span></div>${state}
      <div class="ctrl"><div class="line">${modeSeg(k)}<span class="pv" id="pvBadge" hidden>PV</span></div>${stage}</div></div>`;
  }
  if (k === 'licht') {
    const opts = [`<option value="">${t('sceneChoose')}</option>`, `<option value="off">${t('sceneOff')}</option>`]
      .concat([...Array(12).keys()].map((i) => `<option value="${i + 1}">${t('scene')} ${i + 1}</option>`)).join('');
    const dmx = x.dmx ? `<div class="line"><select class="dmx" id="dmxSel">${opts}</select></div>` : '';
    return `<div class="${cls} relay">
      <div class="lbl"><span class="main">${x.light ? t('light') : t('dmx')}:</span><span class="sub" id="${id}rt"></span></div>
      ${x.light ? state : '<div class="state"></div>'}
      <div class="ctrl">${x.light ? `<div class="line">${modeSeg(k)}</div>` : ''}${dmx}</div></div>`;
  }
  return `<div class="${cls} relay">
    <div class="lbl"><span class="main">${t(x.label)}:</span><span class="sub" id="${id}rt"></span></div>${state}
    <div class="ctrl">${modeSeg(k)}</div></div>`;
}

function relayPairCell(list, cls) {
  const rows = list.map((r) => `<div class="rrow">
      <span class="rname ${r.named ? '' : 'dim'}">${esc(r.name)}</span>
      <span class="lamp" id="${kid(r.id)}lamp"></span>
      ${r.virtual ? onOffSeg(r.id) : modeSeg(r.id, 'small')}</div>`).join('');
  return `<div class="${cls}"><div class="rlist">${rows}</div></div>`;
}

/* ---------- Anzeige aktualisieren ---------- */
function render() {
  const sig = JSON.stringify([relayView, tempRows(), waterRows(), relayRows(), relayList().map((r) => r.id + r.name), F.analog.map((a) => a.id), LANG]);
  if (sig !== layoutSig) { layoutSig = sig; build(); }
  const { T, R } = JSON.parse($('grid').dataset.rows || '{"T":[],"R":[]}');

  if (!relayView) {
    T.forEach((x, r) => {
      const id = `temperatur.sensor${x.sensor}`;
      setHtml(`t${r}`, has(id) ? tempText(x.sensor, 2) : '–');
      setHtml(`tmm${r}`, has(`${id}_min`) ? `<span class="lo">${fmt(V[`${id}_min`], 2)}°</span><span class="hi">${fmt(V[`${id}_max`], 2)}°</span>` : '');
      const sub = x.sub ? `temperatur.sensor${x.sub}` : null;
      setHtml(`tsub${r}`, sub && has(sub) ? `${esc(tempName(x.sub))}: ${tempText(x.sub, 1, ' °C')}` : '');
    });
  } else {
    for (const r of relayList()) {
      if (r.virtual) {
        const lampV = $(`${kid(r.id)}lamp`);
        if (lampV) lampV.className = 'lamp' + (V[r.id] === true ? ' on' : '');
        markSeg(document.querySelector(`.seg[data-key="${r.id}"]`), V[r.id] ? 'ON' : 'OFF', true);
        continue;
      }
      const code = Number(V[`${r.id}.status`]);
      const lamp = $(`${kid(r.id)}lamp`);
      if (lamp) lamp.className = 'lamp' + (code === 2 || code === 5 ? ' wait' : V[`${r.id}.aktiv`] === true ? ' on' : '');
      markSeg(document.querySelector(`.seg[data-key="${r.id}"]`), V[`${r.id}.schalten`] ?? modeFromCode(code), has(`${r.id}.schalten`));
    }
  }

  setText('ph', fmt(V['wasser.ph'], 2)); setHtml('phmm', mm('wasser.ph', 2));
  rangeMark('ph', 'wasser.ph', 'ph'); rangeMark('rdx', 'wasser.redox', 'redox'); rangeMark('cl', 'wasser.chlor', 'chlor');
  rangeMark('botPh', 'wasser.ph', 'ph'); rangeMark('botRdx', 'wasser.redox', 'redox');
  if (has('dosierung.flockung.tagesmenge')) {
    setText('floc', `${fmt(V['dosierung.flockung.tagesmenge'], 0)} ml`);
    setText('flocBig', fmt(V['dosierung.flockung.tagesmenge'], 0));
  }
  setText('phdos', has('dosierung.ph_minus.tagesmenge') ? `pH-: ${fmt(V['dosierung.ph_minus.tagesmenge'], 0)} ${t('mlToday')}` : '');
  dosBadge('phmode', 'dosierung.ph_minus.status');
  setText('rdx', fmt(V['wasser.redox'], 1)); setHtml('rdxmm', mm('wasser.redox', 1));
  setText('cldos', has('dosierung.chlor.tagesmenge') ? `Cl: ${fmt(V['dosierung.chlor.tagesmenge'], 0)} ${t('mlToday')}` : '');
  dosBadge('clmode', 'dosierung.chlor.status');
  setText('cl', fmt(V['wasser.chlor'], 2)); setHtml('clmm', mm('wasser.chlor', 2));
  document.querySelectorAll('[data-an]').forEach((e) => (e.textContent = fmt(V[e.dataset.an], Number(e.dataset.d))));
  document.querySelectorAll('[data-note]').forEach((e) => {
    const d = /bar/i.test(e.dataset.unit) ? 2 : 1;
    e.textContent = `${fmt(V[e.dataset.note], d)} ${e.dataset.unit}`;
  });

  for (const x of R) {
    const k = x.key, id = kid(k);
    if (k !== 'licht' || x.light) {
      const code = Number(V[`${k}.status`]);
      const lamp = $(`${id}lamp`);
      if (lamp) lamp.className = 'lamp' + (code === 2 || code === 5 ? ' wait' : V[`${k}.aktiv`] === true ? ' on' : '');
      setText(`${id}txt`, STATUS_TXT()[code] || '–');
      const rt = V[`${k}.laufzeit_heute`];
      const vol = k === 'pumpe' && typeof V['pumpe.umwaelzung_heute'] === 'number' ? ` (${fmt(V['pumpe.umwaelzung_heute'], 1)} m³)` : '';
      setText(`${id}rt`, rt ? `${String(rt).replace(/ \d+s$/, '')}${vol}` : '');
      markSeg(document.querySelector(`.seg[data-key="${k}"]`), V[`${k}.schalten`] ?? modeFromCode(code), has(`${k}.schalten`));
    }
    if (k === 'pumpe') {
      const running = V['pumpe.aktiv'] === true;
      const stage = Number(V['pumpe.stufe']);
      const segS = document.querySelector('.seg[data-speed]');
      if (segS) {
        const sel = running && STAGES[stage] ? stage : has('pumpe.drehzahl_soll') ? V['pumpe.drehzahl_soll'] : '';
        markSeg(segS, String(sel), true, !has('pumpe.drehzahl_soll'));
        segS.querySelectorAll('button').forEach((b) => b.classList.toggle('run', running && Number(b.dataset.v) === stage));
      }
      const pv = $('pvBadge');
      if (pv) pv.hidden = !(F.pv && has('pv.ueberschuss') && Number(V['pv.ueberschuss']) > 0);
    }
    if (k === 'licht' && x.dmx) {
      const sel = $('dmxSel');
      if (sel && document.activeElement !== sel) {
        let active = '';
        for (let s = 1; s <= 12; s++) if (V[`dmx.szene${s}.aktiv`] === true) { active = String(s); break; }
        sel.value = active;
        sel.disabled = !has('dmx.szene1.schalten');
      }
    }
  }

  const hw = $('hero').dataset.w, ha = $('hero').dataset.a;
  if (hw) $('heroWater').innerHTML = tempText(hw, 2);
  if (ha) $('heroAir').innerHTML = tempText(ha, 2);
  $('botPh').textContent = `pH: ${fmt(V['wasser.ph'], 2)}`;
  $('botRdx').textContent = `RedOx: ${fmt(V['wasser.redox'], 1)}`;
  const fl = $('botFlow');
  if (fl.dataset.id) fl.textContent = `${fl.dataset.name}: ${fmt(V[fl.dataset.id], 2)} cm/s`;
  $('fw').textContent = `${t('fw')}: ${V['system.firmware'] ?? '–'}`;
  $('up').textContent = `${t('uptime')}: ${V['system.laufzeit'] ?? '–'}`;
  $('cpu').textContent = `CPU: ${fmt(V['system.cpu_temperatur'], 1)} °C`;
  alignLabels();
}

function setText(id, s) { const e = $(id); if (e) e.textContent = s; }
function setHtml(id, s) { const e = $(id); if (e) e.innerHTML = s; }
const mm = (id, d) => (has(`${id}_min`) ? `<span class="lo">${fmt(V[`${id}_min`], d)}</span><span class="hi">${fmt(V[`${id}_max`], d)}</span>` : '');
const modeFromCode = (c) => (c === 4 ? 'ON' : c === 6 ? 'OFF' : 'AUTO');

function dosBadge(el, id) {
  const e = $(el);
  if (!e) return;
  if (!has(id)) { e.style.visibility = 'hidden'; return; }
  e.style.visibility = '';
  const m = modeFromCode(Number(V[id]));
  e.className = 'badge ' + (m === 'AUTO' ? 'auto' : m === 'ON' ? 'man-on' : 'man-off');
  e.textContent = m === 'AUTO' ? 'AUTO' : 'MAN';
  e.title = t('dosingOnly');
}

function markSeg(seg, value, visible, readOnly) {
  if (!seg) return;
  const key = seg.dataset.key || 'speed';
  const canSwitch = (F.switching || demo) && !readOnly;
  seg.style.display = visible || seg.dataset.speed ? '' : 'none'; // ohne „Schalten erlauben“ keine Schalter
  seg.querySelectorAll('button').forEach((b) => {
    b.disabled = !canSwitch || (!visible && !seg.dataset.speed);
    b.classList.toggle('sel', String(b.dataset.v) === String(value));
    b.classList.toggle('pending', pending[key] === b.dataset.v);
  });
}

/* ---------- Relais-Ansicht ---------- */
function toggleRelayView(force) {
  relayView = typeof force === 'boolean' ? force : !relayView;
  clearTimeout(relayViewTimer);
  if (relayView && CONFIG.relayViewTimeout > 0) relayViewTimer = setTimeout(() => toggleRelayView(false), CONFIG.relayViewTimeout * 1000);
  render();
}
function touchRelayView() {
  if (relayView) toggleRelayView(true);
}

/* ---------- Schalten ---------- */
async function send(id, value, okMsg) {
  if (demo) {
    await new Promise((r) => setTimeout(r, 500));
    const base = id.replace(/\.(schalten|drehzahl_soll)$/, '');
    if (id === 'pumpe.drehzahl_soll') { V[id] = Number(value); V['pumpe.stufe'] = Number(value); }
    else {
      V[id] = value;
      V[`${base}.status`] = value === 'ON' ? 4 : value === 'OFF' ? 6 : 1;
      V[`${base}.aktiv`] = value !== 'OFF';
    }
    toast(t('demoSim'));
    return;
  }
  const r = await fetch(`${CONFIG.api}/api/set?id=${encodeURIComponent(id)}&value=${encodeURIComponent(value)}`, { signal: AbortSignal.timeout(6000) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
  toast(okMsg);
  setTimeout(load, 2500);
}

async function onSegClick(ev) {
  const btn = ev.target.closest('button');
  if (!btn || btn.disabled) return;
  touchRelayView();
  const seg = btn.parentElement;
  const isSpeed = !!seg.dataset.speed;
  const key = isSpeed ? 'speed' : seg.dataset.key;
  const id = isSpeed ? 'pumpe.drehzahl_soll' : seg.dataset.virtual ? key : `${key}.schalten`;
  const value = btn.dataset.v;

  if (key === 'pumpe' && value === 'OFF' && !confirm(t('confirmPumpOff'))) return;

  pending[key] = value;
  render();
  try {
    await send(id, value, isSpeed ? `${t('speedSet')}: ${STAGES[value]}` : `${t('sent')}: ${value}`);
  } catch (e) {
    toast(`${t('failed')}: ${e.message}`);
  }
  delete pending[key];
  render();
}

async function onDmxChange(ev) {
  const v = ev.target.value;
  let active = 0;
  for (let s = 1; s <= 12; s++) if (V[`dmx.szene${s}.aktiv`] === true) { active = s; break; }
  try {
    if (v === 'off') { if (active) await send(`dmx.szene${active}.schalten`, 'OFF', `${t('sceneOff')}`); }
    else if (v) {
      if (active && String(active) !== v) await send(`dmx.szene${active}.schalten`, 'OFF', '');
      await send(`dmx.szene${v}.schalten`, 'ON', `${t('scene')} ${v}`);
      for (let s = 1; s <= 12; s++) if (demo) V[`dmx.szene${s}.aktiv`] = String(s) === v;
    }
  } catch (e) {
    toast(`${t('failed')}: ${e.message}`);
  }
  ev.target.blur();
  render();
}

/* ---------- Meldungen der Violet ---------- */
async function openMessages() {
  const url = F.violetUrl || '';
  if (url) window.open(url, '_blank', 'noopener');
  try {
    if (demo) { F.messages.active = false; }
    else await fetch(`${CONFIG.api}/api/ack`, { signal: AbortSignal.timeout(6000) });
  } catch { /* egal – nächster Abruf zeigt den Stand */ }
  setTimeout(load, 500);
}
$('conn').addEventListener('click', () => { if ($('conn').classList.contains('msg')) openMessages(); });

/* ---------- Daten laden (eingebauter Webserver des Adapters) ---------- */
function applyFeatures() {
  try {
    const f = JSON.parse(V['info.features'] || '{}');
    F = {
      temps: f.temps || [], relays: f.relays || [], analog: f.analog || [],
      switching: !!f.switching, pumpRpm: !!f.pumpRpm, pv: !!f.pv, dmx: !!f.dmx,
      violetUrl: f.violetUrl || '', messages: f.messages || { enabled: false }, font: f.font || 'verdana', lang: f.lang,
      ranges: f.ranges || {}, rows: f.rows || [], hero: f.hero || [], vrelays: f.vrelays || [], t1Pool: !!f.t1Pool,
    };
    if (!params.get('lang') && f.lang) LANG = String(f.lang).slice(0, 2) === 'de' ? 'de' : 'en';
    document.documentElement.lang = LANG;
    document.documentElement.style.setProperty('--font', FONTS[params.get('font') || F.font] || FONTS.verdana);
  } catch { /* bleibt wie es ist */ }
}

function liveStatus(connected) {
  const m = F.messages || {};
  if (m.enabled && m.active) {
    const txt = m.text ? `: ${m.text.length > 70 ? m.text.slice(0, 67) + '…' : m.text}` : '';
    const label = m.count > 1 ? `${m.count} ${t('msgs')}` : t('msg');
    setConn('msg', `${label}${txt}`);
    $('conn').title = `${m.time ? m.time + ' – ' : ''}${m.text || ''}\n${t('msgHint')}`;
    return;
  }
  $('conn').title = '';
  if (demo) setConn('demo', t('demo'));
  else setConn(connected ? '' : 'err', connected ? `${t('live')} · ${new Date().toLocaleTimeString(LOCALE())}` : t('stale'));
}

let fails = 0;
async function load() {
  if (demo) {
    if (!Object.keys(V).length) V = { ...DEMO };
    const keepMsg = F.messages && F.messages.enabled ? F.messages : null;
    applyFeatures();
    if (keepMsg) F.messages = keepMsg;
    liveStatus(true); render(); return;
  }
  try {
    const r = await fetch(`${CONFIG.api}/api/data`, { cache: 'no-store', signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (!j.ok) throw new Error(t('noValues'));
    V = { ...j.values, 'info.features': JSON.stringify(j.features || {}) };
    applyFeatures();
    fails = 0;
    liveStatus(j.connected);
    render();
  } catch (e) {
    fails++;
    const why = e.name === 'TimeoutError' ? t('timeout') : e.message === 'Failed to fetch' ? t('unreachable') : e.message;
    setConn('err', `Violet-Adapter ${CONFIG.api}: ${why}`);
    if (!Object.keys(V).length) showProblem(why);
  }
}
function showProblem(why) {
  $('grid').style.gridTemplateColumns = '1fr';
  $('grid').innerHTML = `<div class="cell ev" style="justify-content:center;flex-direction:column;gap:.3em;min-height:150px;text-align:center">
    <span style="font-size:1.4em">${t('noData')}</span>
    <span class="note" style="font-size:.85em"><b>${esc(CONFIG.api)}</b>: ${esc(why)}</span>
    <span class="note" style="font-size:.85em">${t('noDataHint')} <b>${esc(CONFIG.api)}/api/data</b></span>
    <span class="note" style="font-size:.85em">${t('demoHint')}</span></div>`;
  layoutSig = '';
  setTimeout(fit, 0);
}

function setConn(cls, txt) { const c = $('conn'); c.className = 'conn ' + cls; c.textContent = txt; }

let toastT;
function toast(msg) {
  if (!msg) return;
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200);
}

function tick() {
  const now = new Date();
  $('date').textContent = now.toLocaleDateString(LOCALE(), { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  $('time').textContent = now.toLocaleTimeString(LOCALE()) + t('clockSuffix');
}

/* Beschriftungen je Spalte gleich breit -> Doppelpunkte stehen untereinander */
function alignLabels() {
  for (const col of ['twT', 'twW']) {
    const l = [...document.querySelectorAll(`.${col} .lbl`)];
    l.forEach((e) => { e.style.flexBasis = 'auto'; });
    const max = Math.max(0, ...l.map((e) => e.offsetWidth));
    l.forEach((e) => { e.style.flexBasis = max + 'px'; });
  }
}
if (document.fonts) document.fonts.ready.then(alignLabels);

/* feste ProCon-Ansicht (1374 px breit), wird auf das Fenster skaliert */
function fit() {
  const w = document.querySelector('.wrap');
  const k = Math.min(window.innerWidth / 1374, window.innerHeight / w.offsetHeight);
  const x = Math.max(0, (window.innerWidth - 1374 * k) / 2);
  w.style.transform = `translate(${x}px, 0) scale(${k})`;
}
window.addEventListener('resize', fit);

tick(); setInterval(tick, 1000);
load(); setInterval(load, CONFIG.pollMs);
</script>
</body>
</html>
