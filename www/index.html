<!--
  Pool-Display für ioBroker.violet – im Stil der alten ProCon.IP-Anzeige
  Datenquelle: eingebauter Webserver des Violet-Adapters (Standard-Port 8099) – keine weiteren Adapter nötig
  Baut sich selbst auf: angezeigt wird nur, was der Adapter liefert (info.features).
  Optional anpassen: Block CONFIG unten (Paarung der Temperaturen)
  URL-Parameter: ?api=http://10.10.3.x:8099   ?demo=1
-->
<style>
  :root {
    --bg: #54585e;          /* mittleres Grau */
    --bg-deep: #3f4247;
    --row-a: #000;
    --row-b: rgba(0,0,0,.28);
    --line: rgba(255,255,255,.55);
    --text: #fff;
    --muted: #c9ccd1;
    --min: #6ea8ff;
    --max: #ff6b6b;
    --on: #3ddc5c;
    --off: #e0383e;
    --wait: #f0b429;
    --auto: #2e9e44;
    --manual-on: #2f6fd6;
    --manual-off: #b8262c;
    --seg: #2a2d31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: var(--bg-deep); }
  body {
    background: radial-gradient(ellipse at top, #62666c 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: Verdana, "DejaVu Sans", Tahoma, sans-serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 1374px; margin: 0; transform-origin: 0 0; padding: 19.2px 22.0px; }

  /* ---------- obere Tabelle ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr 1.15fr; }
  .head {
    text-align: center; font-size: 17.2px; letter-spacing: .04em;
    padding: .55em 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .rows { display: contents; }
  .cell {
    display: flex; align-items: center; gap: .8em;
    min-height: 76.9px; padding: .35em .9em;
    font-size: 14.4px;
  }
  .ev { background: var(--row-a); } .od { background: var(--row-b); }

  .lbl { flex: 1 1 52%; text-align: right; line-height: 1.25; }
  .lbl .main { font-size: 1.12em; }
  .lbl .sub { display: block; font-size: .72em; font-weight: 400; color: var(--muted); }
  .val { flex: 1 1 48%; line-height: 1.15; }
  .val .big { font-size: 1.6em; white-space: nowrap; }
  .val .unit { font-size: .6em; color: var(--muted); margin-left: .15em; }
  .mm { display: block; font-size: .68em; font-weight: 400; white-space: nowrap; }
  .mm .lo { color: var(--min); margin-right: .9em; } .mm .hi { color: var(--max); }
  .mm .lo::before { content: "↓"; } .mm .hi::before { content: "↑"; }
  .note { display: block; font-size: .66em; font-weight: 400; color: var(--muted); }
  .center .val { text-align: center; }

  .badge {
    font-size: .62em; padding: .45em .6em; border-radius: 5px; min-width: 4.6em; text-align: center;
    border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .badge.auto { background: linear-gradient(#3cb556, var(--auto)); }
  .badge.man-on { background: linear-gradient(#4c8af0, var(--manual-on)); }
  .badge.man-off { background: linear-gradient(#d8414a, var(--manual-off)); }
  .badge.none { background: #444; color: #aaa; }

  /* Relais-Spalte */
  .relay .lbl { flex: 0 0 34%; }
  .state { flex: 0 0 auto; display: flex; align-items: center; gap: .5em; min-width: 5.2em; }
  .lamp {
    width: 1em; height: 1em; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #ff9a9a, var(--off) 55%, #6b0f12);
    box-shadow: 0 0 .5em rgba(224,56,62,.6);
  }
  .lamp.on { background: radial-gradient(circle at 35% 30%, #b8ffc5, var(--on) 55%, #0c5a1c); box-shadow: 0 0 .6em rgba(61,220,92,.75); }
  .lamp.wait { background: radial-gradient(circle at 35% 30%, #ffe6a3, var(--wait) 55%, #6b4a05); box-shadow: 0 0 .6em rgba(240,180,41,.7); }
  .extra { font-size: .72em; font-weight: 400; color: var(--muted); text-align: right; flex: 1; white-space: nowrap; }

  .seg { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); flex: 0 0 auto; }
  .seg button {
    font: inherit; font-size: .7em; color: #ddd; background: var(--seg); border: 0; cursor: pointer;
    padding: .55em .75em; border-right: 1px solid rgba(255,255,255,.15); min-width: 3.6em;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover:not(:disabled) { background: #3a3e43; color: #fff; }
  .seg button.sel.auto { background: var(--auto); color: #fff; }
  .seg button.sel.on { background: var(--manual-on); color: #fff; }
  .seg button.sel.off { background: var(--manual-off); color: #fff; }
  .seg button.sel.lvl { background: #6c737b; color: #fff; }
  .seg button.pending { animation: pulse .8s ease-in-out infinite; }
  .seg button:disabled { cursor: default; opacity: .45; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* Datum / Uhrzeit */
  .clock {
    display: flex; justify-content: center; gap: 3.5em; align-items: baseline;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 13.7px;
    padding: .35em 0; font-size: 31.6px; letter-spacing: .05em;
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
  }

  .clock { position: relative; }
  .clock .logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 1.7em; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }

  /* Große Anzeige */
  .hero { display: grid; grid-template-columns: 1fr 1fr; background: #000; margin-top: 13.7px; }
  .hero > div { text-align: center; padding: .15em 0 .6em; }
  .hero .num { font-size: 158.0px; line-height: 1; letter-spacing: -.01em; }
  .hero .cap { margin-top: 1.1em; }
  .hero .cap { font-size: 16.5px; }

  .bottom {
    display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; text-align: center;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 13.7px; padding: .25em 0;
  }
  .bottom .xl { font-size: 41.2px; }
  .bottom .md { font-size: 15.8px; }

  .foot {
    display: flex; justify-content: center; gap: 3em; flex-wrap: wrap; padding: .7em 0 .2em;
    font-size: 11.7px; font-weight: 400; color: var(--muted);
  }
  .conn::before { content: "●"; margin-right: .4em; color: var(--on); }
  .conn.err::before { color: var(--off); }
  .conn.demo::before { color: var(--wait); }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(150%);
    background: #111; border: 1px solid rgba(255,255,255,.3); padding: .7em 1.1em; border-radius: 8px;
    font-size: 13px; font-weight: 400; transition: transform .25s ease, opacity .25s; z-index: 9; max-width: 90vw; opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

</style>
</head>

<script>
/* =====================================================================
   KONFIGURATION – optional, alles andere erkennt das Pool-Display selbst
   ===================================================================== */
const CONFIG = {
  // Adresse des Violet-Adapters; Standard: die Seite wird vom Adapter selbst ausgeliefert
  api: location.protocol.startsWith('http') ? location.origin : 'http://localhost:8099',
  pollMs: 5000,

  // Temperatur-Zeilen: Hauptwert + kleine Zusatzzeile (Sensor-Nummern der Violet).
  // Nicht angeschlossene Sensoren werden automatisch weggelassen.
  // Leere Liste [] = automatisch alle angeschlossenen Sensoren, je zwei pro Zeile.
  temps: [
    { label: 'Außentemperatur',  sensor: 2, subLabel: 'Schwimmbad',     subSensor: 11 },
    { label: 'Absorber',         sensor: 3, subLabel: 'Solar Rücklauf', subSensor: 4 },
    { label: 'Wassertemperatur', sensor: 1, subLabel: 'Heizung VL',     subSensor: 8 },
    { label: 'Pool Rücklauf',    sensor: 7, subLabel: 'Heizung RL',     subSensor: 9 },
  ],
  heroWater: 1,   // große Anzeige links  (Sensor-Nummer)
  heroAir: 2,     // große Anzeige rechts (Sensor-Nummer)
};

/* =====================================================================
   ab hier nichts ändern nötig
   ===================================================================== */
const params = new URLSearchParams(location.search);
if (params.get('api')) CONFIG.api = params.get('api').replace(/\/+$/, '');
let demo = params.get('demo') === '1';

const STATUS_TXT = { 0: 'AUS', 1: 'EIN', 2: 'EIN', 3: 'EIN', 4: 'EIN', 5: 'WARTET', 6: 'AUS' };
const STAGES = { 1: 'ECO', 2: 'Normal', 3: 'Boost' };
// mögliche Funktionen in der Relais-Spalte (erscheinen nur, wenn vorhanden)
const FUNCS = [
  { key: 'pumpe', label: 'Filterpumpe' },
  { key: 'solar', label: 'Absorber' },
  { key: 'heizung', label: 'Heizung' },
  { key: 'licht', label: 'Licht' },
  { key: 'eco', label: 'ECO-Modus' },
  { key: 'rueckspuelung', label: 'Rückspülung' },
  { key: 'nachspeisung', label: 'Nachspeisung' },
];
const FLOW_UNITS = /cm\/s/i;

/* ---------- Demo-Daten (Werte deiner Anlage vom 09.10.2026) ---------- */
const DEMO = {
  'info.features': JSON.stringify({
    switching: true, pumpRpm: true,
    temps: [1, 2, 3, 4, 7, 8, 9, 11].map((n) => ({ n, name: `Temperatur ${n}` })),
    relays: [],
    analog: [
      { id: 'analog.adc1', name: 'Filterdruck', unit: 'bar' },
      { id: 'analog.adc5', name: 'Luftfeuchte', unit: '%rF' },
      { id: 'analog.impuls1', name: 'Anströmung', unit: 'cm/s' },
    ],
  }),
  'wasser.ph': 7.22, 'wasser.ph_min': 7.19, 'wasser.ph_max': 7.29,
  'wasser.redox': 885.2, 'wasser.redox_min': 824.9, 'wasser.redox_max': 898.7,
  'wasser.chlor': 0.19, 'wasser.chlor_min': 0.14, 'wasser.chlor_max': 0.36,
  'dosierung.ph_minus.tagesmenge': 8, 'dosierung.ph_minus.status': 0, 'dosierung.chlor.tagesmenge': 9, 'dosierung.chlor.status': 0,
  'temperatur.sensor1': 21.1, 'temperatur.sensor1_min': 20.1, 'temperatur.sensor1_max': 21.3,
  'temperatur.sensor2': 12.0, 'temperatur.sensor2_min': 10.0, 'temperatur.sensor2_max': 12.0,
  'temperatur.sensor3': 12.3, 'temperatur.sensor3_min': 8.4, 'temperatur.sensor3_max': 16.2,
  'temperatur.sensor4': 22.4, 'temperatur.sensor7': 21.1, 'temperatur.sensor7_min': 19.3, 'temperatur.sensor7_max': 21.2,
  'temperatur.sensor8': 31.9, 'temperatur.sensor9': 29.5, 'temperatur.sensor11': 21.7,
  'analog.adc5': 63.0, 'analog.adc1': 0.0, 'analog.impuls1': 0.0,
  'pumpe.status': 1, 'pumpe.aktiv': true, 'pumpe.schalten': 'AUTO', 'pumpe.laufzeit_heute': '06h 49m 17s', 'pumpe.stufe': 2, 'pumpe.drehzahl_soll': 2,
  'solar.status': 6, 'solar.aktiv': false, 'solar.schalten': 'OFF', 'solar.laufzeit_heute': '00h 00m 00s',
  'heizung.status': 6, 'heizung.aktiv': false, 'heizung.schalten': 'OFF', 'heizung.laufzeit_heute': '00h 00m 00s',
  'system.firmware': '1.2.5', 'system.laufzeit': '09d 16h 25m', 'system.cpu_temperatur': 53.2,
};
// Demo-Varianten zum Ausprobieren: ?demo=1&ohne=heizung,solar
if (params.get('ohne')) for (const k of params.get('ohne').split(',')) for (const id of Object.keys(DEMO)) if (id.startsWith(k + '.')) delete DEMO[id];

let V = {};
let F = { temps: [], relays: [], analog: [] };
let layoutSig = '';
const pending = {};
const $ = (id) => document.getElementById(id);
const has = (id) => V[id] !== undefined && V[id] !== null;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmt(v, d = 1) {
  if (v === undefined || v === null || v === '' || !Number.isFinite(Number(v))) return '–';
  return Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
}

/* ---------- was ist vorhanden? ---------- */
const tempName = (n) => (F.temps.find((t) => t.n === n) || {}).name || `Temperatur ${n}`;
const tempOk = (n) => has(`temperatur.sensor${n}`) && (!F.temps.length || F.temps.some((t) => t.n === n));

function tempRows() {
  if (CONFIG.temps && CONFIG.temps.length) {
    return CONFIG.temps
      .filter((t) => tempOk(t.sensor) || tempOk(t.subSensor))
      .map((t) => (tempOk(t.sensor) ? t : { label: t.subLabel || tempName(t.subSensor), sensor: t.subSensor }))
      .map((t) => ({ ...t, subSensor: t.subSensor !== t.sensor && tempOk(t.subSensor) ? t.subSensor : null }));
  }
  const list = (F.temps.length ? F.temps.map((t) => t.n) : [...Array(12).keys()].map((i) => i + 1)).filter(tempOk);
  const rows = [];
  for (let i = 0; i < list.length; i += 2) {
    rows.push({ label: tempName(list[i]), sensor: list[i], subLabel: list[i + 1] ? tempName(list[i + 1]) : '', subSensor: list[i + 1] || null });
  }
  return rows;
}

function waterRows() {
  const rows = [];
  if (has('wasser.ph')) rows.push('ph');
  if (has('wasser.redox')) rows.push('redox');
  if (has('wasser.chlor')) rows.push('chlor');
  const an = F.analog.filter((a) => !FLOW_UNITS.test(a.unit) && has(a.id));
  for (let i = 0; i < an.length; i += 2) rows.push({ main: an[i], note: an[i + 1] });
  return rows;
}

function relayRows() {
  const rows = [];
  for (const f of FUNCS) {
    if (!has(`${f.key}.status`)) continue;
    rows.push({ key: f.key, label: f.label });
    if (f.key === 'pumpe' && (has('pumpe.stufe') || has('pumpe.drehzahl_soll'))) rows.push({ speed: true });
  }
  for (const r of F.relays) if (has(`${r.id}.status`)) rows.push({ key: r.id, label: r.name });
  return rows;
}

/* ---------- Aufbau ---------- */
function build() {
  const T = tempRows(), W = waterRows(), R = relayRows();
  const n = Math.max(T.length, W.length, R.length, 1);
  const cols = [T.length && 'TEMPERATUREN', W.length && 'WASSERWERTE', R.length && 'RELAISSTATUS'];
  const used = cols.filter(Boolean).length || 1;
  const g = $('grid');
  g.style.gridTemplateColumns = cols.map((c, i) => (c ? (i === 2 ? '1.15fr' : '1fr') : null)).filter(Boolean).join(' ') || '1fr';
  g.innerHTML = cols.filter(Boolean).map((h) => `<div class="head">${h}</div>`).join('');
  for (let r = 0; r < n; r++) {
    const cls = `cell ${r % 2 ? 'od' : 'ev'}`;
    if (T.length) g.insertAdjacentHTML('beforeend', T[r] ? tempCell(T[r], r, cls) : `<div class="${cls}"></div>`);
    if (W.length) g.insertAdjacentHTML('beforeend', W[r] ? waterCell(W[r], r, cls) : `<div class="${cls}"></div>`);
    if (R.length) g.insertAdjacentHTML('beforeend', R[r] ? relayCell(R[r], cls) : `<div class="${cls} relay"></div>`);
  }
  g.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', onSegClick));
  g.dataset.rows = JSON.stringify({ T, W, R });

  // große Anzeige und Fußzeile
  const hw = tempOk(CONFIG.heroWater) ? CONFIG.heroWater : (T[0] || {}).sensor;
  const ha = tempOk(CONFIG.heroAir) ? CONFIG.heroAir : (T[1] || {}).sensor;
  $('hero').style.display = hw || ha ? '' : 'none';
  $('heroWaterBox').style.display = hw ? '' : 'none';
  $('heroAirBox').style.display = ha ? '' : 'none';
  $('heroWaterCap').textContent = hw === CONFIG.heroWater ? 'Wassertemperatur' : tempName(hw);
  $('heroAirCap').textContent = ha === CONFIG.heroAir ? 'Außentemperatur' : tempName(ha);
  $('hero').style.gridTemplateColumns = hw && ha ? '1fr 1fr' : '1fr';
  $('hero').dataset.w = hw || ''; $('hero').dataset.a = ha || '';
  const flow = F.analog.find((a) => FLOW_UNITS.test(a.unit) && has(a.id));
  $('botFlow').style.visibility = flow ? '' : 'hidden';
  $('botFlow').dataset.id = flow ? flow.id : '';
  $('botFlow').dataset.name = flow ? flow.name : '';
  $('botPh').style.visibility = has('wasser.ph') ? '' : 'hidden';
  $('botRdx').style.visibility = has('wasser.redox') ? '' : 'hidden';
  setTimeout(fit, 0);
}

function tempCell(t, r, cls) {
  return `<div class="${cls}">
    <div class="lbl"><span class="main">${esc(t.label)}:</span><span class="sub" id="tsub${r}"></span></div>
    <div class="val"><span class="big" id="t${r}">–</span><span class="mm" id="tmm${r}"></span></div></div>`;
}

function waterCell(w, r, cls) {
  if (w === 'ph') return `<div class="${cls}"><div class="lbl"><span class="main">pH:</span></div>
    <div class="val"><span class="big" id="ph">–</span><span class="mm" id="phmm"></span><span class="note" id="phdos"></span></div>
    <span class="badge" id="phmode">–</span></div>`;
  if (w === 'redox') return `<div class="${cls}"><div class="lbl"><span class="main">RedOx:</span></div>
    <div class="val"><span class="big" id="rdx">–</span><span class="unit">mV</span><span class="mm" id="rdxmm"></span><span class="note" id="cldos"></span></div>
    <span class="badge" id="clmode">–</span></div>`;
  if (w === 'chlor') return `<div class="${cls}"><div class="lbl"><span class="main">Chlor:</span></div>
    <div class="val"><span class="big" id="cl">–</span><span class="unit">mg/l</span><span class="mm" id="clmm"></span></div></div>`;
  return `<div class="${cls}"><div class="lbl"><span class="main">${esc(w.main.name)}:</span></div>
    <div class="val"><span class="big" data-an="${w.main.id}" data-d="${w.main.unit === 'bar' ? 2 : 1}">–</span><span class="unit">${esc(w.main.unit)}</span>
    ${w.note ? `<span class="note" data-note="${w.note.id}" data-name="${esc(w.note.name)}" data-unit="${esc(w.note.unit)}"></span>` : ''}</div></div>`;
}

function relayCell(x, cls) {
  if (x.speed) return `<div class="${cls} relay">
    <div class="lbl"><span class="main">Drehzahl:</span></div>
    <div class="state"><span id="stagetxt">–</span></div>
    <div class="seg" data-speed="1">
      <button data-v="1" class="lvl">ECO</button><button data-v="2" class="lvl">Normal</button><button data-v="3" class="lvl">Boost</button>
    </div></div>`;
  const k = x.key, kid = k.replace(/\./g, '_');
  return `<div class="${cls} relay">
    <div class="lbl"><span class="main">${esc(x.label)}:</span><span class="sub" id="${kid}rt"></span></div>
    <div class="state"><span class="lamp" id="${kid}lamp"></span><span id="${kid}txt">–</span></div>
    <div class="seg" data-key="${k}">
      <button data-v="AUTO" class="auto">AUTO</button><button data-v="ON" class="on">EIN</button><button data-v="OFF" class="off">AUS</button>
    </div></div>`;
}

/* ---------- Anzeige aktualisieren ---------- */
function render() {
  const sig = JSON.stringify([tempRows(), waterRows(), relayRows(), F.analog.map((a) => a.id)]);
  if (sig !== layoutSig) { layoutSig = sig; build(); }
  const { T, R } = JSON.parse($('grid').dataset.rows || '{"T":[],"R":[]}');

  T.forEach((t, r) => {
    const id = `temperatur.sensor${t.sensor}`;
    $(`t${r}`).textContent = has(id) ? `${fmt(V[id], 2)}°` : '–';
    $(`tmm${r}`).innerHTML = has(`${id}_min`) ? `<span class="lo">${fmt(V[`${id}_min`], 2)}°</span><span class="hi">${fmt(V[`${id}_max`], 2)}°</span>` : '';
    const sub = t.subSensor ? `temperatur.sensor${t.subSensor}` : null;
    $(`tsub${r}`).textContent = sub && has(sub) ? `${t.subLabel || tempName(t.subSensor)}: ${fmt(V[sub], 1)}°C` : '';
  });

  setText('ph', fmt(V['wasser.ph'], 2)); setHtml('phmm', mm('wasser.ph', 2));
  setText('phdos', has('dosierung.ph_minus.tagesmenge') ? `pH-: ${fmt(V['dosierung.ph_minus.tagesmenge'], 0)} ml heute` : '');
  dosBadge('phmode', 'dosierung.ph_minus.status');
  setText('rdx', fmt(V['wasser.redox'], 1)); setHtml('rdxmm', mm('wasser.redox', 1));
  setText('cldos', has('dosierung.chlor.tagesmenge') ? `Cl: ${fmt(V['dosierung.chlor.tagesmenge'], 0)} ml heute` : '');
  dosBadge('clmode', 'dosierung.chlor.status');
  setText('cl', fmt(V['wasser.chlor'], 2)); setHtml('clmm', mm('wasser.chlor', 2));
  document.querySelectorAll('[data-an]').forEach((e) => (e.textContent = fmt(V[e.dataset.an], Number(e.dataset.d))));
  document.querySelectorAll('[data-note]').forEach((e) => {
    const d = /bar/i.test(e.dataset.unit) ? 2 : 1;
    e.textContent = `${e.dataset.name}: ${fmt(V[e.dataset.note], d)} ${e.dataset.unit}`;
  });

  for (const x of R) {
    if (x.speed) {
      const stage = V['pumpe.stufe'];
      setText('stagetxt', V['pumpe.aktiv'] && STAGES[stage] ? `Stufe ${stage}` : V['pumpe.aktiv'] ? 'läuft' : 'STOP');
      const wanted = has('pumpe.drehzahl_soll') ? V['pumpe.drehzahl_soll'] : null;
      markSeg(document.querySelector('.seg[data-speed]'), String(V['pumpe.aktiv'] && STAGES[stage] ? stage : wanted ?? ''), has('pumpe.drehzahl_soll'));
      continue;
    }
    const k = x.key, kid = k.replace(/\./g, '_');
    const code = Number(V[`${k}.status`]);
    $(`${kid}lamp`).className = 'lamp' + (code === 5 ? ' wait' : V[`${k}.aktiv`] === true ? ' on' : '');
    $(`${kid}txt`).textContent = STATUS_TXT[code] || '–';
    const rt = V[`${k}.laufzeit_heute`];
    $(`${kid}rt`).textContent = rt ? `heute ${String(rt).replace(/ \d+s$/, '')}` : '';
    markSeg(document.querySelector(`.seg[data-key="${k}"]`), V[`${k}.schalten`] ?? modeFromCode(code), has(`${k}.schalten`));
  }

  const hw = $('hero').dataset.w, ha = $('hero').dataset.a;
  if (hw) $('heroWater').textContent = `${fmt(V[`temperatur.sensor${hw}`], 2)}°`;
  if (ha) $('heroAir').textContent = `${fmt(V[`temperatur.sensor${ha}`], 2)}°`;
  $('botPh').textContent = `pH: ${fmt(V['wasser.ph'], 2)}`;
  $('botRdx').textContent = `RedOx: ${fmt(V['wasser.redox'], 1)}`;
  const fl = $('botFlow');
  if (fl.dataset.id) fl.textContent = `${fl.dataset.name}: ${fmt(V[fl.dataset.id], 2)} cm/s`;
  $('fw').textContent = `Firmware: ${V['system.firmware'] ?? '–'}`;
  $('up').textContent = `Uptime: ${V['system.laufzeit'] ?? '–'}`;
  $('cpu').textContent = `CPU: ${fmt(V['system.cpu_temperatur'], 1)} °C`;
}

function setText(id, t) { const e = $(id); if (e) e.textContent = t; }
function setHtml(id, t) { const e = $(id); if (e) e.innerHTML = t; }
const mm = (id, d) => (has(`${id}_min`) ? `<span class="lo">${fmt(V[`${id}_min`], d)}</span><span class="hi">${fmt(V[`${id}_max`], d)}</span>` : '');
const modeFromCode = (c) => (c === 2 || c === 4 ? 'ON' : c === 6 ? 'OFF' : 'AUTO');

function dosBadge(el, id) {
  const e = $(el);
  if (!e) return;
  if (!has(id)) { e.style.visibility = 'hidden'; return; }
  e.style.visibility = '';
  const m = modeFromCode(Number(V[id]));
  e.className = 'badge ' + (m === 'AUTO' ? 'auto' : m === 'ON' ? 'man-on' : 'man-off');
  e.textContent = m === 'AUTO' ? 'AUTO' : 'MAN';
  e.title = 'Dosierung – nur Anzeige';
}

function markSeg(seg, value, enabled) {
  if (!seg) return;
  const key = seg.dataset.key || 'speed';
  seg.style.display = enabled ? '' : 'none'; // ohne „Schalten erlauben“ keine Schalter
  seg.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('sel', String(b.dataset.v) === String(value));
    b.classList.toggle('pending', pending[key] === b.dataset.v);
  });
}

/* ---------- Schalten ---------- */
async function onSegClick(ev) {
  const btn = ev.target.closest('button');
  if (!btn || btn.disabled) return;
  const seg = btn.parentElement;
  const isSpeed = !!seg.dataset.speed;
  const key = isSpeed ? 'speed' : seg.dataset.key;
  const id = isSpeed ? 'pumpe.drehzahl_soll' : `${key}.schalten`;
  const value = btn.dataset.v;

  if (key === 'pumpe' && value === 'OFF' && !confirm('Filterpumpe wirklich manuell AUSschalten?')) return;

  pending[key] = value;
  render();
  try {
    if (demo) {
      await new Promise((r) => setTimeout(r, 600));
      V[id] = isSpeed ? Number(value) : value;
      if (!isSpeed) {
        V[`${key}.status`] = value === 'ON' ? 4 : value === 'OFF' ? 6 : 1;
        V[`${key}.aktiv`] = value !== 'OFF';
      } else V['pumpe.stufe'] = Number(value);
      toast('Demo: Befehl simuliert');
    } else {
      const r = await fetch(`${CONFIG.api}/api/set?id=${encodeURIComponent(id)}&value=${encodeURIComponent(value)}`, { signal: AbortSignal.timeout(6000) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
      toast(isSpeed ? `Drehzahl ${STAGES[value]} gesetzt` : `Befehl gesendet: ${value}`);
      setTimeout(load, 2500);
    }
  } catch (e) {
    toast(`Schalten fehlgeschlagen: ${e.message}`);
  }
  delete pending[key];
  render();
}

/* ---------- Daten laden (eingebauter Webserver des Adapters) ---------- */
function applyFeatures() {
  try {
    const f = JSON.parse(V['info.features'] || '{}');
    F = { temps: f.temps || [], relays: f.relays || [], analog: f.analog || [] };
  } catch { /* bleibt wie es ist */ }
}

let fails = 0;
async function load() {
  if (demo) { if (!Object.keys(V).length) V = { ...DEMO }; applyFeatures(); setConn('demo', 'Demo-Daten'); render(); return; }
  try {
    const r = await fetch(`${CONFIG.api}/api/data`, { cache: 'no-store', signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (!j.ok) throw new Error('der Adapter hat noch keine Daten von der Violet');
    V = { ...j.values, 'info.features': JSON.stringify(j.features || {}) };
    applyFeatures();
    fails = 0;
    setConn(j.connected ? '' : 'err', j.connected ? `Live · ${new Date().toLocaleTimeString('de-DE')}` : 'Violet zurzeit nicht erreichbar – letzte Werte');
    render();
  } catch (e) {
    fails++;
    const why = e.name === 'TimeoutError' ? 'keine Antwort (Zeitüberschreitung)' : e.message === 'Failed to fetch' ? 'nicht erreichbar' : e.message;
    setConn('err', `Violet-Adapter ${CONFIG.api}: ${why}`);
    if (!Object.keys(V).length) showProblem(why);
  }
}
function showProblem(why) {
  $('grid').style.gridTemplateColumns = '1fr';
  $('grid').innerHTML = `<div class="cell ev" style="justify-content:center;flex-direction:column;gap:.3em;min-height:150px;text-align:center">
    <span style="font-size:1.4em">Keine Daten vom Violet-Adapter</span>
    <span class="note" style="font-size:.85em"><b>${esc(CONFIG.api)}</b>: ${esc(why)}</span>
    <span class="note" style="font-size:.85em">Läuft die Instanz violet.0 und ist in der Konfiguration „Pool-Display bereitstellen“ aktiviert? Test im Browser:
      <b>${esc(CONFIG.api)}/api/data</b></span>
    <span class="note" style="font-size:.85em">Vorschau mit Beispielwerten: <b>?demo=1</b> an die Adresse anhängen</span></div>`;
  layoutSig = '';
  setTimeout(fit, 0);
}

function setConn(cls, txt) { const c = $('conn'); c.className = 'conn ' + cls; c.textContent = txt; }

let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

function tick() {
  const now = new Date();
  $('date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  $('time').textContent = now.toLocaleTimeString('de-DE') + ' Uhr';
}

/* feste ProCon-Ansicht (1374 px breit), wird auf das Fenster skaliert */
function fit() {
  const w = document.querySelector('.wrap');
  const k = Math.min(window.innerWidth / 1374, window.innerHeight / w.offsetHeight);
  const x = Math.max(0, (window.innerWidth - 1374 * k) / 2);
  w.style.transform = `translate(${x}px, 0) scale(${k})`;
}
window.addEventListener('resize', fit);

tick(); setInterval(tick, 1000);
load(); setInterval(load, CONFIG.pollMs);
</script>
</body>
</html>
